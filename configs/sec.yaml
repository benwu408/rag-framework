corpus: sec                 # SEC filings corpus

ingest:
  file_types: [".pdf", ".txt", ".htm", ".html"]

chunk:
  strategy: recursive
  chunk_size: 768
  chunk_overlap: 128

embed:
  model: text-embedding-3-small
  batch_size: 64

retrieve:
  top_k: 8
  score_threshold: 0.1

answer:
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 2048
  system_prompt: |
    You are a financial analyst assistant. Answer questions about SEC filings using
    only the provided excerpts. Cite specific sections or page numbers when possible.
    If the information is not present in the context, explicitly state that.

eval:
  queries_file: eval/queries/sec.csv
  metrics: [hit_rate, mrr, faithfulness]
